# Render Blueprint: one click deploys the API (web service) + the website (static site).
# Dashboard -> New -> Blueprint -> pick your GitHub repo. Then see "Deploy on Render" in the README.
services:
  - type: web
    name: floodsense-api
    runtime: python
    rootDir: backend
    plan: free                      # free sleeps after 15 min idle; use "starter" ($7/mo) for always-on + routing
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: USE_BEDROCK              # 0 = rule-based advice (no AWS needed). Set 1 + AWS keys to use Amazon Bedrock
        value: "0"
      - key: ALLOWED_ORIGIN           # set to your static site URL after first deploy, e.g. https://floodsense-web.onrender.com
        sync: false

  - type: web
    name: floodsense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL             # set to your API URL, e.g. https://floodsense-api.onrender.com  (no trailing slash)
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
