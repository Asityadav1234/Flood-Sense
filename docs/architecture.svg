<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d6277"/></marker></defs>
<rect width="1180" height="640" fill="#ffffff"/>
<text x="20" y="32" font-size="22" font-weight="700" fill="#16324f">FloodSense AI: architecture</text>
<text x="20" y="52" font-size="13" fill="#4d6277">Serverless on AWS. Solid arrows = request path, dashed = scheduled / background.</text>
<rect x="20" y="250" width="150" height="80" rx="8" fill="#e8f6ee" stroke="#2f9e62" stroke-width="1.5"/>
<text x="95.0" y="286.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Resident / city staff</text>
<text x="95.0" y="303.0" text-anchor="middle" font-size="11" fill="#4d6277">React + Leaflet map</text>
<rect x="230" y="110" width="170" height="60" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="315.0" y="136.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon CloudFront</text>
<text x="315.0" y="153.0" text-anchor="middle" font-size="11" fill="#4d6277">HTTPS + security headers</text>
<rect x="230" y="190" width="170" height="50" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="315.0" y="211.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon S3 (site)</text>
<text x="315.0" y="228.0" text-anchor="middle" font-size="11" fill="#4d6277">static React build</text>
<rect x="230" y="300" width="170" height="70" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="315.0" y="331.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Lambda Function URL</text>
<text x="315.0" y="348.0" text-anchor="middle" font-size="11" fill="#4d6277">public HTTPS API</text>
<rect x="470" y="270" width="210" height="130" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="575.0" y="331.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">AWS Lambda (container)</text>
<text x="575.0" y="348.0" text-anchor="middle" font-size="11" fill="#4d6277"><tspan x="575.0" dy="0">FastAPI: flood, heat, drought,</tspan><tspan x="575.0" dy="13">leaks, alerts, ask, safe places</tspan><tspan x="575.0" dy="13">rate limits + shared cache</tspan></text>
<rect x="760" y="70" width="190" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="855.0" y="94.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon Bedrock</text>
<text x="855.0" y="111.0" text-anchor="middle" font-size="11" fill="#4d6277">Nova Lite + Guardrails</text>
<rect x="760" y="150" width="190" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="855.0" y="174.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon DynamoDB</text>
<text x="855.0" y="191.0" text-anchor="middle" font-size="11" fill="#4d6277">leaks (CellIndex), watch list, cache</text>
<rect x="760" y="230" width="190" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="855.0" y="254.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon S3 (photos)</text>
<text x="855.0" y="271.0" text-anchor="middle" font-size="11" fill="#4d6277">private, presigned upload, 30-day expiry</text>
<rect x="760" y="310" width="190" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="855.0" y="334.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon Rekognition</text>
<text x="855.0" y="351.0" text-anchor="middle" font-size="11" fill="#4d6277">water + pipe check, moderation</text>
<rect x="760" y="390" width="190" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="855.0" y="414.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon SNS</text>
<text x="855.0" y="431.0" text-anchor="middle" font-size="11" fill="#4d6277">email + SMS, filtered by area/level/language</text>
<rect x="470" y="470" width="210" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="575.0" y="494.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Amazon EventBridge</text>
<text x="575.0" y="511.0" text-anchor="middle" font-size="11" fill="#4d6277">every 3 hours: early-warning monitor</text>
<rect x="1000" y="390" width="160" height="56" rx="8" fill="#e8f6ee" stroke="#2f9e62" stroke-width="1.5"/>
<text x="1080.0" y="414.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Subscribers</text>
<text x="1080.0" y="431.0" text-anchor="middle" font-size="11" fill="#4d6277">email / SMS in their language</text>
<rect x="470" y="100" width="210" height="110" rx="8" fill="#f0f0f0" stroke="#8a98a6" stroke-width="1.5"/>
<text x="575.0" y="151.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Free public data</text>
<text x="575.0" y="168.0" text-anchor="middle" font-size="11" fill="#4d6277"><tspan x="575.0" dy="0">Open-Meteo (rain, heat, drought)</tspan><tspan x="575.0" dy="13">OpenStreetMap / Overpass</tspan><tspan x="575.0" dy="13">Copernicus DEM elevation</tspan></text>
<line x1="170" y1="285" x2="230" y2="140" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<text x="200.0" y="207.5" text-anchor="middle" font-size="10.5" fill="#4d6277">site</text>
<line x1="315" y1="170" x2="315" y2="190" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="170" y1="300" x2="230" y2="330" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<text x="200.0" y="310.0" text-anchor="middle" font-size="10.5" fill="#4d6277">API</text>
<line x1="400" y1="335" x2="470" y2="335" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="575" y1="270" x2="575" y2="210" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<text x="575.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#4d6277">forecast + map data</text>
<line x1="680" y1="300" x2="760" y2="98" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="320" x2="760" y2="178" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="340" x2="760" y2="258" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="360" x2="760" y2="338" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="380" x2="760" y2="418" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="575" y1="470" x2="575" y2="400" stroke="#4d6277" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="640" y="440" text-anchor="middle" font-size="10.5" fill="#4d6277">scheduled run</text>
<line x1="950" y1="418" x2="1000" y2="418" stroke="#4d6277" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="170" y1="265" x2="760" y2="258" stroke="#4d6277" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="470" y="250" text-anchor="middle" font-size="10.5" fill="#4d6277">photo upload straight to S3 (presigned POST)</text>
<text x="20" y="610" font-size="12" fill="#4d6277">Data flows: rule-based risk scores are the source of truth; Bedrock only turns them into plain-language advice and translations.</text>
</svg>